services:
  django_app:
    build: .
    image: waleedansarii/django-notes-app:latest      # ← pushable name
    container_name: django_cont
    command: sh -c "python manage.py migrate --noinput && gunicorn notesapp.wsgi --bind 0.0.0.0:8000"
    env_file: [ ".env" ]
    depends_on:
      db:
        condition: service_healthy                    # ← wait for MySQL, not just "started"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/admin/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [ notes-app-nw ]

  db:
    image: mysql:8.0                                  # ← pin it ("mysql" = floating latest)
    container_name: db_cont
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-test_db}
    volumes:
      - db-data:/var/lib/mysql                        # ← named volume (survives redeploys)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: always
    networks: [ notes-app-nw ]

  nginx:
    build: ./nginx
    image: waleedansarii/django-notes-nginx:latest    # ← pushable name
    container_name: nginx_cont
    ports:
      - "8081:80"                                     # the ONLY public port
    depends_on:
      django_app:
        condition: service_started
    restart: always
    networks: [ notes-app-nw ]

networks:
  notes-app-nw:
    driver: bridge

volumes:
  db-data:
