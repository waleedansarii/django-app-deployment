trigger:
  branches: { include: [ main ] }
pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  DOCKERHUB_CONNECTION: 'dockerhub-creds'
  DB_NAME: 'test_db'
  # VM_IP and DB_PASSWORD come from pipeline variables

steps:
# ==========================================
# STEP 1: CHECKOUT CODE
# ==========================================
- checkout: self
  displayName: 'Checkout Code'

# ==========================================
# STEP 2: BUILD & PUSH
# ==========================================
- task: Docker@2
  displayName: 'Login to Docker Hub'
  inputs:
    command: login
    containerRegistry: '$(DOCKERHUB_CONNECTION)'

- script: |
    docker compose build
    docker compose push
  displayName: 'Build and Push Images'

- script: docker logout
  displayName: 'Logout Docker'
  condition: always()

# ==========================================
# STEP 3: DEPLOY TO VM
# ==========================================
- task: SSH@0
  displayName: 'Deploy to Azure VM'
  inputs:
    sshEndpoint: 'my-azure-vm-connection'
    failOnStdErr: false 
    runOptions: 'inline'
    inline: |
      echo "Connecting to VM..."
      mkdir -p /opt/django-app
      cd /opt/django-app
      
      # Create the .env file on the VM
      echo "DB_NAME=$(DB_NAME)" > .env
      echo "DB_USER=root" >> .env
      echo "DB_PASSWORD=$(DB_PASSWORD)" >> .env
      echo "DB_HOST=db" >> .env
      echo "DB_PORT=3306" >> .env
      
      # Run the app
      docker compose pull
      docker compose up -d --remove-orphans
      docker image prune -f

# ==========================================
# STEP 4: SMOKE TEST
# ==========================================
- script: |
    echo "Waiting 30 seconds for containers to start and DB to initialize..."
    sleep 30
    
    echo "Pinging http://$(VM_IP):8081/"
                                                                                               # -f (fail silently on HTTP errors), -s (silent), -S (show error if fails), -o /dev/null (discard body)
                                                                                               # -w prints the HTTP status code. If it's not 200, the '|| exit 1' fails the pipeline.
    curl -fsS -o /dev/null -w 'HTTP Status: %{http_code}\n' http://$(VM_IP):8081/ || exit 1
    
    echo "Smoke test passed! App is live."
  displayName: 'Smoke Test (curl)'

# ==========================================
# STEP 5: POST NOTIFICATIONS (Simple Steps)
# ==========================================
- script: echo 'Deployment successful!'
  displayName: 'Success Message'
  condition: succeeded()                                                      # Only runs if all previous steps passed

- script: |
    echo 'Deployment failed — check logs above.'
    exit 1                                                                    # Fails the step so the pipeline shows up as Red/Failed
  displayName: 'Failure Message'
  condition: failed()                                                         # Only runs if any previous step failed
